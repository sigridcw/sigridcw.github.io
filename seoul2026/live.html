<style>

a{color:var(--ink);text-decoration-color:var(--copper);text-underline-offset:3px;text-decoration-thickness:2px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#183b42,#0d2429);color:#f9f6ee;padding:14px 16px 10px;box-shadow:var(--shadow)}
.brand{display:flex;gap:12px;align-items:center}
.mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,var(--copper),#9d5134);display:grid;place-items:center;font-family:var(--serif);font-size:20px;border:1px solid rgba(255,255,255,.24);box-shadow:0 8px 20px rgba(197,111,69,.22);flex:none}

nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
nav button{font:600 15px var(--sans);color:#f9f6ee;background:transparent;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:7px 13px;cursor:pointer}
nav button.on{background:var(--white);color:var(--ink);border-color:var(--white);box-shadow:inset 0 -3px var(--copper)}
main{max-width:820px;margin:0 auto;padding:18px 14px 80px}
section.tab{display:none;animation:fade .25s ease}section.tab.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.eyebrow{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--copper);margin:22px 0 6px}
h2{font-family:var(--serif);font-weight:900;font-size:clamp(24px,5vw,32px);letter-spacing:-.045em;line-height:1.2;margin:0 0 12px}
h3{font-size:18px;margin:0 0 6px;line-height:1.4}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.card.em{border-top:3px solid var(--copper)}
.dark{background:linear-gradient(135deg,#183b42,#0d2429);color:#f9f6ee;border-radius:22px;padding:22px;margin-bottom:16px;box-shadow:var(--shadow)}
.dark .muted{color:#c9d3cf}.dark a{color:#fff}
.muted{color:var(--muted);font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;background:var(--paper-2);color:var(--ink-3)}
.badge.sage{background:var(--sage-soft);color:#3f5d48}.badge.sand{background:var(--sand-soft);color:#7a6235}.badge.crit{background:var(--critical-soft);color:var(--critical)}.badge.cop{background:var(--copper-soft);color:#8a4527}.badge.plum{background:var(--plum-soft);color:var(--plum)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:12px 0}
.metrics>div{padding:14px 12px;border-right:1px solid var(--line)}.metrics>div:last-child{border-right:0}
.mlabel{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mval{font-family:var(--mono);font-size:24px;font-weight:500;margin-top:6px}
.dark .metrics{border-color:rgba(255,255,255,.13)}.dark .metrics>div{border-color:rgba(255,255,255,.13)}.dark .mlabel{color:#c9d3cf}
.btn{font:680 16px var(--sans);border-radius:10px;padding:11px 16px;border:1px solid var(--line);background:var(--white);color:var(--ink);cursor:pointer;transition:160ms ease}
.btn:hover{background:var(--copper-soft)}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.primary:hover{background:var(--ink-2);transform:translateY(-1px)}
.chip{font:600 15px var(--sans);border:1px solid var(--line);background:rgba(255,254,249,.7);color:var(--ink-3);border-radius:999px;padding:8px 13px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
input,select,textarea{font:16px var(--sans);width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink)}
label.f{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
/* day strip */
.days{display:flex;justify-content:space-between;position:relative;padding:8px 4px 2px}
.days:before{content:"";position:absolute;left:8%;right:8%;top:27px;border-top:1px dashed var(--ink-3)}
.days button{flex:1;background:none;border:0;cursor:pointer;z-index:1;font-family:var(--sans);color:var(--ink)}
.dot{width:30px;height:30px;margin:4px auto 0;border-radius:50%;background:var(--white);border:1px solid var(--ink-3);display:grid;place-items:center;font-size:14px;transition:.2s}
.days button.on .dot{width:44px;height:44px;margin-top:-3px;background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 0 0 3px var(--copper-soft)}
.dlabel{font-family:var(--mono);font-weight:700;font-size:14px;margin-top:4px}
/* timeline */
.tl{position:relative;padding-left:26px;margin-top:8px}
.tl:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;border-left:1px solid var(--line)}
.stop{position:relative;margin-bottom:12px}
.stop:before{content:"";position:absolute;left:-23px;top:22px;width:9px;height:9px;border-radius:50%;background:var(--copper);border:2px solid var(--white);box-shadow:0 0 0 1px var(--copper)}
.stop .card{margin:0;box-shadow:inset 3px 0 var(--copper)}
.time{font-family:var(--mono);font-size:20px;font-weight:700}
.tag{border-radius:7px;padding:3px 9px;font-size:13px;font-weight:700}
.t-car{background:var(--sand-soft);color:#7a6235}.t-taxi{background:#f6e7c8;color:#7a5a1c}.t-walk{background:var(--sage-soft);color:#3f5d48}.t-fly{background:var(--plum-soft);color:var(--plum)}.t-rest{background:var(--paper-2);color:var(--ink-3)}.t-eat{background:var(--copper-soft);color:#8a4527}.t-shop{background:#f1e2ea;color:#7c4b62}.t-meet{background:#dbe8ea;color:#21515a}
details{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:14px}
summary{font-weight:700;cursor:pointer;font-size:17px}
/* conflict */
.ctl{position:relative;margin:10px 0 6px}
.axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:#c9d3cf;margin:0 0 4px 72px}
.lane{display:flex;align-items:center;gap:8px;margin:8px 0}
.lane .ln{width:64px;flex:none;font-size:13px;font-weight:700;line-height:1.3}
.track{position:relative;flex:1;height:34px;background:rgba(255,255,255,.06);border-radius:8px}
.seg{position:absolute;top:4px;bottom:4px;border-radius:6px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;color:#10272c;padding:0 4px}
.s-post{background:#efe6d3}.s-tea{background:#c56f45;color:#fff}.s-van{background:#dfe9df}.s-taxi{background:#f6e7c8}.s-chk{background:#e8e0e8}.s-x{background:repeating-linear-gradient(45deg,#a84f40 0 6px,#e07660 6px 12px);color:#fff}
.plan{border-left:3px solid var(--copper);padding:6px 0 6px 12px;margin:12px 0}
/* bars */
.bar{margin:10px 0}.bar .bl{display:flex;justify-content:space-between;font-size:15px;gap:8px}
.bar .bt{height:14px;background:var(--paper-2);border-radius:999px;overflow:hidden;margin-top:4px;position:relative}
.bar .bf{height:100%;background:var(--ink);border-radius:999px}.bar .bf.c{background:var(--copper)}.bar .bf.s{background:var(--sage)}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.scroll{overflow-x:auto}
.ok{color:#3f7a4f;font-weight:700}.no{color:var(--critical);font-weight:700}.mid{color:#7a6235;font-weight:700}
.entry{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.entry .ic{font-size:24px;width:34px;text-align:center}.entry .amt{text-align:right;font-family:var(--mono)}
.x{border:1px solid var(--line);background:var(--white);border-radius:8px;width:34px;height:34px;cursor:pointer;color:var(--muted)}
.sync{font-family:var(--mono);font-size:12px;letter-spacing:.08em}
.big{font-family:var(--mono);font-size:30px;font-weight:500}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}.steps li{counter-increment:s;position:relative;padding:8px 0 8px 42px;border-bottom:1px solid var(--line)}
.steps li:before{content:counter(s);position:absolute;left:0;top:8px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--mono);font-size:14px;display:grid;place-items:center}
.ck{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}.ck input{width:24px;height:24px;flex:none;accent-color:var(--ink);margin-top:2px}
.ck.done span{text-decoration:line-through;color:var(--muted)}
footer{font-size:13px;color:var(--muted);text-align:center;padding:20px}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.cd div{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 4px;text-align:center}.cd b{display:block;font-family:var(--mono);font-size:26px;font-weight:500}.cd span{font-size:12px;color:#c9d3cf}
.leg{border:1px solid var(--line);border-radius:16px;background:var(--white);margin-bottom:12px;overflow:hidden}

.opt{padding:12px 16px;border-top:1px solid var(--line)}.opt.rec{box-shadow:inset 3px 0 var(--copper);background:#fffaf4}
.l2{display:inline-block;background:#00a84d;color:#fff;border-radius:6px;padding:1px 8px;font-size:13px;font-weight:700}
.driver{margin-top:8px;border:2px solid var(--ink);border-radius:12px;padding:12px;background:#fff;cursor:pointer}
.driver .ko{font-size:26px;font-weight:700;line-height:1.3}.driver .ad{font-size:19px;margin-top:4px}

.lnow{display:flex;gap:12px;align-items:center;margin-top:12px}
.lbig{font-size:34px;width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none;border:1px solid rgba(255,255,255,.18)}
.lnext{margin-top:12px;border-left:3px solid var(--copper);padding:4px 0 4px 12px}
.lnext b{font-family:var(--mono);font-size:26px;font-weight:500;color:#f3dfd1}
#route{position:relative;margin-top:6px}
#route svg{position:absolute;left:0;top:0;width:100%;height:100%;z-index:0;overflow:visible}
.lstop{position:relative;z-index:1;display:flex;align-items:center;gap:10px;width:80%;margin:0 0 22px;cursor:pointer}
.lstop.r{margin-left:20%;flex-direction:row-reverse}
.ldot{flex:none;width:48px;height:48px;border-radius:50%;background:var(--white);border:1px solid var(--ink-3);display:grid;place-items:center;font-size:22px;position:relative;transition:.2s}
.lstop .card{flex:1;margin:0;padding:12px 14px;box-shadow:inset 3px 0 var(--line)}
.lstop.done .ldot{background:var(--sage-soft);border-color:var(--sage)}
.lstop.done .card{opacity:.72}
.lstop.done .ldot:after{content:"✔";position:absolute;right:-6px;top:-6px;width:22px;height:22px;border-radius:50%;background:var(--sage);color:#fff;font-size:12px;display:grid;place-items:center;border:2px solid var(--white);transform:rotate(-12deg);animation:stamp .45s}
.lstop.cur .ldot{background:var(--ink);color:#fff;border-color:var(--ink);animation:glow 1.8s infinite}
.lstop.cur .card{box-shadow:inset 3px 0 var(--copper);border-color:var(--copper)}
.lstop.nxt .ldot{border:2px dashed var(--copper)}
.lstop h3{font-size:16px;margin:2px 0 0}
.lstop .time{font-size:16px}
.family{position:absolute;z-index:3;transition:top 1.2s ease,left 1.2s ease;pointer-events:none;width:120px;margin-left:-60px;margin-top:-92px;text-align:center}
.ppl{display:flex;justify-content:center}
.pp{display:flex;flex-direction:column;align-items:center;animation:walk .6s ease-in-out infinite alternate}
.pp:nth-child(2){animation-delay:.2s}.pp:nth-child(3){animation-delay:.4s}
.pp span{font-size:28px;line-height:1}
.pp em{font:700 11px var(--sans);font-style:normal;background:var(--ink);color:#fff;border-radius:999px;padding:0 6px;margin-top:2px}
.bubble{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);width:max-content;max-width:200px;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:4px 10px;font-size:14px;text-align:center;box-shadow:var(--shadow);margin-bottom:6px}
.bubble:after{content:"";position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--white)}
.modal{position:fixed;inset:0;background:rgba(16,39,44,.45);display:none;align-items:flex-end;justify-content:center;z-index:40}
.modal.on{display:flex}
.sheet{background:var(--white);border-radius:22px 22px 0 0;max-width:820px;width:100%;padding:20px 18px 34px;max-height:80vh;overflow:auto;animation:up .25s}
.dbg{background:var(--plum);color:#fff;font:600 12px var(--mono);text-align:center;padding:3px;letter-spacing:.08em}
.leaf{position:fixed;top:-30px;z-index:1;pointer-events:none;animation:fall linear infinite;opacity:.22}
.days{overflow-x:auto}
@keyframes fall{0%{transform:translate(0,-30px) rotate(0)}100%{transform:translate(-20px,105vh) rotate(360deg)}}
@keyframes walk{0%{transform:translateY(0) rotate(-5deg)}100%{transform:translateY(-6px) rotate(5deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 3px var(--copper-soft),0 0 0 3px rgba(197,111,69,.5)}50%{box-shadow:0 0 0 3px var(--copper-soft),0 0 0 12px rgba(197,111,69,0)}}
@keyframes stamp{0%{transform:scale(2.2) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(-12deg);opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
</style>
</head>

  bub.textContent=active&&c>=0?line(D.s[c].n):'準備出發囉～ ❤';
}
function pick(i){sel=i;userSel=true;render()}
function show(i){const x=DAYS[sel].s[i];
  sheet.innerHTML=`<div class="eyebrow" style="margin-top:0">${x.ic} ${DAYS[sel].d}</div><span class="time">${x.t}</span>${x.dur?` <span class="muted">${clean(x.dur)}</span>`:''}<h2 style="font-size:24px;margin-top:6px">${x.n}</h2>${x.note?`<p>${x.note}</p>`:''}<div class="row">${x.mode?`<span class="badge cop">${x.mode}</span>`:''}${x.acc?`<span class="badge sage">${x.acc}</span>`:''}</div><p class="muted">💬 ${line(x.n)}</p><button class="btn primary" style="width:100%" onclick="modal.classList.remove('on')">好</button>`;
  modal.classList.add('on')}
modal.onclick=e=>{if(e.target==modal)modal.classList.remove('on')};
// 滑動切換日期
let sx=null;document.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>70){const n=sel+(dx<0?1:-1);if(n>=0&&n<DAYS.length)pick(n)}sx=null});
// 楓葉
for(let i=0;i<6;i++){const l=document.createElement('div');l.className='leaf';l.textContent='🍁';l.style.left=Math.random()*100+'vw';l.style.fontSize=(16+Math.random()*16)+'px';l.style.animationDuration=(9+Math.random()*10)+'s';l.style.animationDelay=(-Math.random()*15)+'s';document.body.appendChild(l)}
window.addEventListener('resize',render);
render();loadLive();setInterval(render,60000);
</script></body></html>
