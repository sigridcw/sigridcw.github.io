const YEAR=2026;
function seoulNow(){
  const q=new URLSearchParams(location.search).get('t');
  if(q){const m=q.match(/(\d{4})-(\d\d)-(\d\d)[T ](\d\d):(\d\d)/);if(m)return{y:+m[1],mo:+m[2],d:+m[3],h:+m[4],mi:+m[5],dbg:q}}
  const p={};new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',hourCycle:'h23'}).formatToParts(new Date()).forEach(x=>p[x.type]=x.value);
  return{y:+p.year,mo:+p.month,d:+p.day,h:+p.hour%24,mi:+p.minute};
}
const toMin=t=>{const[a,b]=t.split(':');return +a*60+ +b};
const fmt=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
// 無咖啡因、不提付款：過濾句子
const BAD=/咖啡|茶|付款|刷卡|現金|綁卡|₩|NT\$|費用|定額/;
function clean(s){if(!s)return'';return s.replace(/、?街區咖啡|、咖啡|咖啡、/g,'').replace(/茶敘/g,'交流時間').split(/(?<=[。；])/).filter(x=>!BAD.test(x)).join('').trim()}
function icon(name,mode){
  const n=name;
  if(/✈|起飛|飛機|TW669|ZE882/.test(n)||mode=='飛機')return'✈️';
  if(/早餐/.test(n))return'🍳';
  if(/宵夜|泡麵/.test(n))return'🍜';
  if(/午餐|晚餐|用餐/.test(n)||mode=='用餐')return'🍲';
  if(/入住|回飯店|退房|飯店/.test(n))return'🏨';
  if(/會議|海報|SIG/.test(n))return'🔬';
  if(/楓|銀杏|首爾林/.test(n))return'🍁';
  if(/景福宮|宮|寺/.test(n))return'🏯';
  if(/塔|Sky/.test(n))return'🗼';
  if(/漢江|噴泉|湖/.test(n))return'🌈';
  if(/韓屋|北村|益善|三清|仁寺/.test(n))return'🏡';
  if(/購物|逛|超市|百貨|Olive|大創|市場/.test(n)||mode=='購物')return'🛍️';
  if(/報到|入境|機場|接機|送機/.test(n))return'🧳';
  if(mode=='計程車')return'🚕';if(mode=='接送車')return'🚐';
  return'📍';
}
const LINES=[[/起飛|飛機/,'飛高高～首爾我們來了！'],[/早餐/,'飯店早餐吃飽飽才有力氣 💪'],[/泡麵|宵夜/,'整面牆的泡麵，好難選喔！'],[/選擇中/,'今天晚上吃什麼呢？好期待～'],[/晚餐|午餐/,'肚子咕嚕咕嚕，開飯囉！🍚'],[/楓|銀杏/,'哇～葉子好漂亮，來拍照！📸'],[/景福宮/,'穿越回朝鮮時代～'],[/林蔭道|散步/,'慢慢走，手牽手 ❤'],[/會議|海報/,'爸爸加油！最棒了！👏'],[/塔|Sky/,'好高喔～看得到我們家嗎？'],[/噴泉|漢江/,'彩虹噴泉亮起來囉 🌈'],[/購物|逛|超市|大創|Olive/,'買伴手禮給大家～🎁'],[/計程車/,'坐車車，休息一下～'],[/接送|接機|送機/,'司機叔叔來接我們囉 🚐'],[/入住|飯店/,'放下行李，出發！'],[/報到|入境/,'護照拿好喔！'],[/回台中|聯合國/,'回家囉，好好玩！🏠']];
const line=n=>{for(const[r,s]of LINES)if(r.test(n))return s;return'一起去冒險吧！✨'};

function normalize(DAYS){
  return DAYS.map(D=>{
    let s=D.s.map(x=>({t:x[0],n:x[1],mode:x[2],dur:x[3],note:x[4],acc:x[6]||''}));
    if(D.d=='10/28'){
      s=s.filter(x=>!/新沙林蔭道/.test(x.n));
      s.forEach(x=>{if(/晚餐/.test(x.n)&&/韓一館/.test(x.n)){x.t='18:30';x.n='晚餐（選擇中）';x.note='全家正在從 4 家餐廳裡挑選，選好再告訴大家！';x.dur='約1.5小時'}});
      s.push({t:'17:00',n:'計程車到新沙站 8 號出口（신사역 8번출구）',mode:'計程車',dur:'約15–20分',note:'從飯店出發，下車就在出口旁。',acc:''});
      s.push({t:'17:20',n:'散步新沙林蔭道（가로수길）約 1.8 公里',mode:'步行',dur:'約1小時',note:'平路好走，慢慢逛、拍拍照。晚上會冷，圍巾戴好。',acc:'平路'});
    }
    s.forEach(x=>{x.m=toMin(x.t);x.n=clean(x.n).replace(/^[\u{1F300}-\u{1FAFF}\u2600-\u27BF\u2B50\uFE0F\s]+/u,'').replace(/（候選見[^）]*）/g,'').replace(/（10\/29–11\/15[^）]*）/,'');x.note=clean(x.note);x.ic=icon(x.n,x.mode)});
    s.sort((a,b)=>a.m-b.m);
    return{d:D.d,w:D.w,t:clean(D.t),wx:D.wx,s};
  });
}
let DAYS=normalize(FALLBACK_DAYS),sel=null,userSel=false;

async function loadLive(){
  try{const r=await fetch('./index.html?_='+Date.now(),{cache:'no-store'});const h=await r.text();
    const a=h.indexOf('const DAYS=['),b=h.indexOf('const DEST=');if(a<0||b<0)return;
    const D=new Function('nmap',h.slice(a,b).replace('const DAYS=','return ')) (q=>q);
    if(Array.isArray(D)&&D.length)DAYS=normalize(D);render();
  }catch(e){}
}
function state(){
  const N=seoulNow();const key=N.mo+'/'+N.d, now=N.h*60+N.mi;
  const idx=DAYS.findIndex(D=>{const[m,d]=D.d.split('/');return +m==N.mo&&+d==N.d});
  const start=new Date(Date.UTC(YEAR,9,28)),today=new Date(Date.UTC(N.y,N.mo-1,N.d));
  const phase=N.y<YEAR||today<start?'before':(idx<0?'after':'during');
  return{N,now,idx,phase,daysLeft:Math.round((start-today)/864e5)};
}
function cur(D,now){let c=-1;D.s.forEach((x,i)=>{if(x.m<=now)c=i});return c}
function render(){
  const S=state();const{N,now}=S;
  clk.textContent=fmt(now);dte.textContent=N.mo+'月'+N.d+'日';
  if(N.dbg&&!document.querySelector('.dbg')){const b=document.createElement('div');b.className='dbg';b.textContent='🧪 模擬時間 '+N.dbg;document.body.appendChild(b)}
  if(!userSel)sel=S.phase=='during'?S.idx:(S.phase=='before'?0:DAYS.length-1);
  tabs.innerHTML=DAYS.map((D,i)=>`<button class="tab${i==sel?' on':''}" onclick="pick(${i})">${D.d}<small>週${D.w}${i==S.idx?' ・今天':''}</small></button>`).join('');
  const D=DAYS[sel];const isToday=S.phase=='during'&&sel==S.idx;
  const dayPast=S.phase=='after'||(S.phase=='during'&&sel<S.idx);
  const c=isToday?cur(D,now):(dayPast?D.s.length-1:-1);
  let top='';
  if(S.phase=='before'&&!userSel||S.phase=='before'&&sel==0&&!isToday){
    top=`<div class="card state"><span class="em">🧳</span>${S.daysLeft>0?`再 <b style="color:var(--maple);font-size:34px">${S.daysLeft}</b> 天就要出發去首爾囉！`:'今天就要出發囉！'}<div class="wx">行李整理好了嗎？❤</div></div>`;
  }else if(S.phase=='after'&&!userSel){
    top=`<div class="card state"><span class="em">🏠</span>我們平安回家囉！<div class="wx">首爾好好玩，謝謝爸爸媽媽 ❤ 下次再一起去！</div></div>`;
  }
  let prog=0;
  if(isToday){const f=D.s[0].m,l=D.s[D.s.length-1].m+60;prog=Math.max(0,Math.min(100,(now-f)/(l-f)*100))}else if(dayPast)prog=100;
  let nowcard='';
  if(isToday){
    const x=c>=0?D.s[c]:null,n=D.s[c+1];
    nowcard=`<div class="now"><div class="big">${x?x.ic:'🌅'}</div><div><div class="lbl">我們現在</div><div class="ttl">${x?x.n:'還沒出門，準備中～'}</div></div></div>`;
    if(n){const dm=n.m-now;const h=Math.floor(dm/60),m=dm%60;
      nowcard+=`<div class="next">⏰ 再 <b>${h?h+' 小時 ':''}${m} 分鐘</b>到下一站：<br>${n.ic} ${n.n}</div>`}
    else nowcard+=`<div class="next">🌙 今天的行程都完成囉！好好休息～</div>`;
  }
  main.innerHTML=top+`<div class="card"><div class="daytitle">${D.d}（${D.w}）${D.t}</div><div class="wx">☀️ ${D.wx}</div>
  <div class="bar"><i style="width:${prog}%"></i></div><div class="barlbl"><span>今天進度</span><span>${Math.round(prog)}%</span></div>${nowcard}</div>
  <div class="card"><div id="route"><svg class="path" id="svg"></svg>${D.s.map((x,i)=>`<div class="stop${i%2?' r':''}${i<c||(dayPast&&i<=c)?' done':''}${i==c&&isToday?' cur':''}${i==c+1&&isToday?' nxt':''}" onclick="show(${i})"><div class="dot">${x.ic}</div><div class="sinfo"><div class="st">${x.t}</div><div class="sn">${x.n}</div></div></div>`).join('')}
  <div class="family" id="fam"><div class="bubble" id="bub"></div><div class="ppl"><div class="p"><span>👨</span><em>爸爸</em></div><div class="p"><span>👩</span><em>媽媽</em></div><div class="p"><span>👧</span><em>佳菁</em></div></div></div></div></div>`;
  requestAnimationFrame(()=>{drawRoute(D,isToday?c:(dayPast?D.s.length-1:0),isToday||dayPast);if(isToday&&!window._sc){window._sc=1;const f=document.getElementById('fam');f&&f.scrollIntoView({block:'center'})}});
}
function drawRoute(D,c,active){
  const R=document.getElementById('route');if(!R)return;const rb=R.getBoundingClientRect();
  const pts=[...R.querySelectorAll('.dot')].map(d=>{const b=d.getBoundingClientRect();return[b.left-rb.left+b.width/2,b.top-rb.top+b.height/2]});
  let p=`M${pts[0][0]},${pts[0][1]}`;for(let i=1;i<pts.length;i++){const[a,b]=pts[i-1],[x,y]=pts[i];const my=(b+y)/2;p+=` C${a},${my} ${x},${my} ${x},${y}`}
  svg.innerHTML=`<path d="${p}" fill="none" stroke="#f2bfa8" stroke-width="6" stroke-dasharray="2 14" stroke-linecap="round"/>`;
  const i=Math.max(0,c);const f=document.getElementById('fam');
  f.style.left=Math.min(Math.max(pts[i][0],62),rb.width-62)+'px';f.style.top=pts[i][1]+'px';
  bub.textContent=active&&c>=0?line(D.s[c].n):'準備出發囉～ ❤';
}
function pick(i){sel=i;userSel=true;render()}
function show(i){const x=DAYS[sel].s[i];
  sheet.innerHTML=`<div style="font-size:48px">${x.ic}</div><div class="meta">${x.t}${x.dur?'・'+clean(x.dur):''}</div><h3>${x.n}</h3>${x.note?`<p>${x.note}</p>`:''}${x.mode?`<span class="chip">${x.mode}</span>`:''}${x.acc?`<span class="chip">♿ ${x.acc}</span>`:''}<p style="color:var(--muted)">💬 ${line(x.n)}</p><button onclick="modal.classList.remove('on')">好的 ❤</button>`;
  modal.classList.add('on')}
modal.onclick=e=>{if(e.target==modal)modal.classList.remove('on')};
// 滑動切換日期
let sx=null;document.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>70){const n=sel+(dx<0?1:-1);if(n>=0&&n<DAYS.length)pick(n)}sx=null});
// 楓葉
for(let i=0;i<14;i++){const l=document.createElement('div');l.className='leaf';l.textContent=['🍁','🍂','🍁','❤'][i%4];l.style.left=Math.random()*100+'vw';l.style.fontSize=(16+Math.random()*16)+'px';l.style.animationDuration=(9+Math.random()*10)+'s';l.style.animationDelay=(-Math.random()*15)+'s';document.body.appendChild(l)}
window.addEventListener('resize',render);
render();loadLive();setInterval(render,60000);
</script></body></html>
