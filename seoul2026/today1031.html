const ST=[["今天最後一整天，早上我和媽媽先去蠶室石村湖看秋天的樹，下午爸爸會合。", "飯店地址：서울특별시 강남구 삼성로 431。走到三成站約 11 分（OSM 步行路網 824m），沿 테헤란로 往東。", "明天 11/1 就要回台灣，今天晚上記得打包、辦線上報到。", "📋 下面「複製地址」可以直接給計程車司機看。"], ["三成站（삼성역）是 2 號線綠色環狀線的站，地下連著 COEX。", "<b>T-money 儲值</b>：站內黃色／白色機器選「교통카드 충전」（交通卡儲值），放卡、投現金（只收現金）。<br>搭往 <b>잠실（蠶室）</b> 方向：삼성 → 종합운동장（綜合運動場）→ 잠실새내（蠶室新川）→ <b>잠실（蠶室）</b>，3 站約 6 分。", "2 號線是首爾最繁忙的環狀線，繞一圈要 1 個半小時。", "看月台上方「잠실 방면」（往蠶室方向）。綜合運動場就是 1988 年首爾奧運主場館。"], ["蠶室（잠실）以前真的是養蠶的地方，朝鮮時代在這裡設「蠶室」養蠶。", "出站後看地面指標「석촌호수」（石村湖），往南走約 8 分（OSM 推算 623m）到西湖北側。", "1970 年代以前這裡是漢江裡的沙洲「蠶室島」，填河造陸後才變成今天的蠶室。", "晚上全家會再來一次這站（去樂天超市）。站內很大，有電梯。"], ["石村湖（석촌호수）是舊漢江河道的遺跡：以前漢江在這裡分成南邊的「松坡江（송파강）」，1971 年蠶室填河工程把它截斷，剩下的水就變成今天的東湖、西湖。", "朝鮮時代這裡是「松坡渡口（송파나루）」，漢江南岸最熱鬧的渡口和市集。<br><b>三田渡碑（삼전도비）</b>：1637 年丙子胡亂，朝鮮仁祖在三田渡向清太宗投降（三跪九叩），清朝要求立碑記功，1639 年立「大清皇帝功德碑」。現在立在石村湖西湖北側（OSM node 6396387213 查證）。", "跟爸媽說：碑上同時刻了滿文、蒙古文和漢文，是韓國歷史上最屈辱的一頁，所以碑曾經被推倒、埋進土裡又挖出來好幾次。", "🪑 湖邊每隔一段就有長椅，西湖一圈約 1.5km，媽媽走一段就坐。湖邊秋天的櫻花樹、楓樹葉子正紅。⚡ 寶可夢：沿湖可以邊坐邊轉（實際以 App 為準）。"], ["魔幻島（매직아일랜드）是樂天世界在西湖湖中島上的戶外樂園。", "樂天世界 1989 年開幕，室外的魔幻島隨後開放，城堡是蠶室的地標。抬頭看北邊就是<b>樂天世界塔（롯데월드타워）555m</b>，123 層，2017 年開幕，韓國最高建築。", "跟爸媽說：城堡長得很像迪士尼的灰姑娘城堡，晚上會亮燈。湖邊的「石村湖水邊舞台（석촌호수 수변무대）」週末有時有表演。", "🪑 在西湖北側／東側長椅坐著看城堡和高塔拍照（水邊舞台精確位置未查證）。"], ["팥단지＝「紅豆罐」，專賣紅豆粥、南瓜粥的韓式粥店。", "地址：서울 송파구 석촌호수로12길 12（OSM 只查到這條街，圖釘在街上）；☎ 0504-3041-8970。營業 10:30–21:00（14:30–16:30 可能休息）。<br><b>⚠️ 今天是否營業未確認，先去看一眼。</b><br>菜單：<br>湯圓紅豆粥（새알심 팥죽）₩14,000（約台幣 342 元）起<br>冬至紅豆粥（동지 팥죽）₩12,000（約台幣 293 元）起<br>老南瓜粥（늙은호박죽）₩12,000（約台幣 293 元）起", "韓國冬至一定吃紅豆粥，相信紅色可以趕走壞東西。湯圓就像我們冬至吃湯圓。", "從石村湖走過來約 1.7km（23 分），媽媽累了就叫計程車（約 5 分）。吃完到 <b>蠶室新川站（잠실새내역）</b>只要走約 300m，也是 2 號線，可以從這裡直接回三成（2 站）。<br><b>備案</b>：樂天世界購物中心（롯데월드몰）6F 萬石場（만석장）白豆腐鍋 ₩15,000（約台幣 367 元）（最新資料 8 月）。"], ["13:50 從蠶室站搭 2 號線往「三成（삼성）」方向 3 站。", "잠실 → 잠실새내 → 종합운동장 → 삼성，約 6 分；三成站走回飯店約 11 分，約 14:20 到。<br><b>飯店附近午餐備案</b>（點地圖上的 🥗）：脆鮮沙拉（크리스피프레시 파르나스몰점）테헤란로 521 파르나스몰 B1，10:30–22:00，三成站 5 號出口附近。", "14:30 爸爸到飯店會合，下午大家休息。", "如果在紅豆罐吃完，就近從蠶室新川站上車。"], ["樂天超市蠶室店（롯데마트 제타플렉스 잠실점）：大型超市，伴手禮一次買齊。", "地址：서울 송파구 올림픽로 240；營業 10:00–23:00。<b>帶護照</b>，結帳後到 let nearI=-1,done=JSON.parse(localStorage.t31Done||'[]'),me=null,acc=0,heading=null,follow=true,next=0;const mk=[];
const dist=(a,b,c,d)=>{const r=6371e3,p=Math.PI/180,x=Math.sin((c-a)*p/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin((d-b)*p/2)**2;return 2*r*Math.asin(Math.sqrt(x))};
const brg=(a,b,c,d)=>{const p=Math.PI/180,y=Math.sin((d-b)*p)*Math.cos(c*p),x=Math.cos(a*p)*Math.sin(c*p)-Math.sin(a*p)*Math.cos(c*p)*Math.cos((d-b)*p);return(Math.atan2(y,x)/p+360)%360};
const fm=m=>m<1000?Math.round(m)+' m':(m/1000).toFixed(1)+' km';
function pinIcon(i){const c=(done.includes(i)?'done':i===next?'nx':'')+(isFood(S[i])?' food':'')+(i===nearI?' near':'');return L.divIcon({className:'',html:`<div class="pin ${c}">${done.includes(i)?'✓':i+1}</div>`,iconSize:[36,36],iconAnchor:[18,18]})}
S.forEach((s,i)=>{mk[i]=L.marker([s[0],s[1]],{icon:pinIcon(i)}).addTo(LAYERS.route).on('click',()=>showStory(i));mk[i].bindTooltip(`${isFood(s)?'🍽️ ':''}${s[2]}<small>${s[3]}</small>`,{permanent:true,interactive:true,direction:'bottom',offset:[0,16],className:'stip'+(isFood(s)?' food':'')});mk[i].getTooltip().on('click',()=>showStory(i));
});
// next stop: nearest stop to me => all before it done; if within 40m of it, it's done too
function phase(){const k=new Date(Date.now()+9*36e5),hm=k.getUTCHours()*60+k.getUTCMinutes();return hm>=16*60+30?1:0}
function computeNext(){const lo=phase()?PM:0,hi=phase()?S.length:PM;if(phase())for(let i=0;i<PM;i++)if(!done.includes(i))done.push(i);if(me){let n=lo,bd=1e9;S.forEach((s,i)=>{if(i<lo||i>=hi)return;const d=dist(me[0],me[1],s[0],s[1]);if(d<bd){bd=d;n=i}});
for(let i=lo;i<n;i++)if(!done.includes(i))done.push(i);if(bd<60&&!done.includes(n))done.push(n);if(bd<40&&!seen.includes(n)){seen.push(n);localStorage.t31Seen=JSON.stringify(seen);showStory(n)}localStorage.t31Done=JSON.stringify(done)}
next=S.findIndex((s,i)=>!done.includes(i));}
function render(){computeNext();nearI=-1;if(me){let bd=60;S.forEach((s,i)=>{const d=dist(me[0],me[1],s[0],s[1]);if(d<bd){bd=d;nearI=i}})}const nb=document.getElementById('near');if(nearI>=0){const v=SIGN[S[nearI][3]];nb.innerHTML=`就在附近！找招牌：<big>${v?v[0]:S[nearI][3]}</big>`;nb.style.display='block'}else nb.style.display='none';document.querySelectorAll('.dist[data-la]').forEach(x=>x.textContent=distTxt(+x.dataset.la,+x.dataset.ln));S.forEach((s,i)=>mk[i].setIcon(pinIcon(i)));

const nt=document.getElementById('nt'),nd=document.getElementById('nd'),ar=document.getElementById('arrow');
if(next<0){nt.innerHTML='<b>🎉 全部走完！</b><div class="ko">搭 2 號線回三成，回飯店打包 🧳</div>';nd.textContent='';ar.style.transform='';return}
const s=S[next];nt.innerHTML=`<div class="ko">下一站 ${next+1} ・點我看全部 ▲</div><b>${s[2]}</b><div class="ko">${s[3]}</div>`;
if(me){nd.textContent=fm(dist(me[0],me[1],s[0],s[1]));const b=brg(me[0],me[1],s[0],s[1]);ar.style.transform=`rotate(${b-(heading??0)}deg)`;ar.title=heading==null?'箭頭以地圖北方為準':'箭頭以手機方向為準'}else nd.textContent=''}
document.addEventListener('click',e=>{const c=e.target.closest('.copy[data-c]');if(c){e.stopPropagation();const t=c.dataset.c;const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()};navigator.clipboard?navigator.clipboard.writeText(t).catch(fb):fb();const o=c.textContent;c.textContent='✅';setTimeout(()=>c.textContent=o,1000);return}

  if(!/^2026-\d\d-\d\d$/.test(d)){alert('日期格式：2026-10-29 或 10/29');return}}
