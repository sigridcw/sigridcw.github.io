const ST=[["今天最後一整天，早上我和媽媽先去石村湖看秋天的樹，下午爸爸會合。", "飯店地址：서울특별시 강남구 삼성로 431。走到三成中央站（삼성중앙역）約 14 分（OSM 步行路網 1,020m），往北到봉은사로。", "明天 11/1 就要回台灣，今天晚上記得打包、辦線上報到。", "📋 下面「複製地址」可以直接給計程車司機看。"], ["三成中央站（삼성중앙역）是金色 9 號線的站，<b>只停普通車（일반）</b>，快車（급행，紅色標示）不停。", "<b>T-money 儲值</b>：站內機器選「교통카드 충전」，只收現金。<br>月台看 <b>중앙보훈병원 방면</b>（往中央報勳醫院方向），搭普通車：삼성중앙 → 봉은사（奉恩寺）→ 종합운동장（綜合運動場）→ 삼전（三田）→ 석촌고분（石村古墳）→ 석촌（石村）→ <b>송파나루（松坡渡口）</b>，6 站約 12 分，不用轉車。", "⚠️ 不要上紅色「급행」快車：快車不停松坡渡口（會從石村直接開到奧林匹克公園）。", "月台上方螢幕會顯示「일반」（普通）或「급행」（快車）。"], ["松坡渡口站（송파나루역）名字來自朝鮮時代石村湖南邊的松坡渡口。", "<b>走 1 號出口</b>（標示：석촌호수、송리단길），<b>4 個出口都有電梯</b>，媽媽搭電梯上地面。<br>出站後<b>直走約 400m</b>，到路口<b>過斑馬線</b>，往看得到「더갤러리 호수」的方向往下走，就是石村湖東湖（석촌호수 동호）步道。OSM 步行約 670m、慢走約 10–12 分。", "松坡區建議沿湖<b>逆時針</b>走。", "出口位置與路線依新聞（京鄉新聞 2026/6）＋OSM 推算；現場跟著「석촌호수」指標走。"], ["石村湖（석촌호수）是舊漢江河道的遺跡：1971 年蠶室填河工程截斷了松坡江（송파강），剩下的水變成今天的東湖、西湖。", "從東湖慢慢沿湖走到西湖南岸，再往西走到紅豆罐，全程約 2.2km，慢走約 30 分＋休息。<br><b>三田渡碑（삼전도비）</b>：1637 年丙子胡亂，朝鮮仁祖在三田渡向清太宗投降，1639 年立「大清皇帝功德碑」，在西湖北側（想看可繞過去）。", "跟爸媽說：碑上同時刻了滿文、蒙古文和漢文。", "🪑 湖邊每隔一段就有長椅，媽媽走一段就坐。⚡ 寶可夢：沿湖可以邊坐邊轉（實際以 App 為準）。"], ["魔幻島（매직아일랜드）是樂天世界在西湖湖中島上的戶外樂園。", "樂天世界 1989 年開幕，室外的魔幻島隨後開放，城堡是蠶室的地標。抬頭看北邊就是<b>樂天世界塔（롯데월드타워）555m</b>，123 層，2017 年開幕，韓國最高建築。", "跟爸媽說：城堡長得很像迪士尼的灰姑娘城堡，晚上會亮燈。湖邊的「石村湖水邊舞台（석촌호수 수변무대）」週末有時有表演。", "🪑 在西湖北側／東側長椅坐著看城堡和高塔拍照（水邊舞台精確位置未查證）。"], ["팥단지＝「紅豆罐」，專賣紅豆粥、南瓜粥的韓式粥店。", "地址：서울 송파구 석촌호수로12길 12（OSM 只查到這條街，圖釘在街上）；☎ 0504-3041-8970。營業 10:30–21:00（14:30–16:30 可能休息）。<br><b>⚠️ 今天是否營業未確認，先去看一眼。</b><br>菜單：<br>湯圓紅豆粥（새알심 팥죽）₩14,000（約台幣 342 元）起<br>冬至紅豆粥（동지 팥죽）₩12,000（約台幣 293 元）起<br>老南瓜粥（늙은호박죽）₩12,000（約台幣 293 元）起", "韓國冬至一定吃紅豆粥，相信紅色可以趕走壞東西。湯圓就像我們冬至吃湯圓。", "從石村湖慢慢走過來約 2.2km（約 30 分），媽媽累了就坐長椅休息或叫 K-Ride 計程車。吃完走約 7 分到三田站（삼전역）搭 9 號線回去。<br><b>備案</b>：樂天世界購物中心（롯데월드몰）6F 萬石場（만석장）白豆腐鍋 ₩15,000（約台幣 367 元）（最新資料 8 月）。"], ["回程：三田站（삼전역）搭 9 號線往 <b>개화（開花）方向</b>，普通車 3 站：삼전 → 종합운동장 → 봉은사 → <b>삼성중앙</b>，約 6 分，不用轉車。", "三田站也只停普通車，別上 급행 快車。三成中央站走回飯店約 14 分，約 14:30 到。<br><b>飯店附近午餐備案</b>（點地圖上的 🥗）：脆鮮沙拉（크리스피프레시 파르나스몰점）테헤란로 521 파르나스몰 B1，10:30–22:00。", "14:30 爸爸到飯店會合，下午大家休息。", "累了也可以叫 K-Ride 計程車回飯店。"], ["晚上全家出發：飯店往北走
