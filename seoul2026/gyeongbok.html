["景福宮是朝鮮王朝第一座、也是最大的正宮，今天我們就從這裡開始！",
"1395年朝鮮開國君主太祖李成桂遷都漢陽後建造景福宮。宮名由開國功臣鄭道傳取自《詩經・大雅・既醉》：「既醉以酒，既飽以德，君子萬年，介爾景福」，意思是祝君王萬年享大福。1592年壬辰倭亂時宮殿全部燒毀，荒廢了將近270年。1867年高宗的父親興宣大院君才把它重建起來，規模達數百棟建築。日本殖民時期大部分建築被拆除，1990年代起韓國政府展開長期復原工程，到今天仍在進行中。",
"可以問爸媽：「景福」兩個字是不是很像我們過年說的「福氣」？其實真的是祝福語！還有，大院君為了重建景福宮，發行了貶值的「當百錢」並加重稅收，搞得民怨沸騰——蓋皇宮真的很燒錢。",
"出口一上來就是宮殿範圍，抬頭看北岳山——景福宮是背山面水的風水寶地。今年10/29–11/15免費開放，人會比較多。"],
["收藏朝鮮王室與大韓帝國文物的國家博物館，門前銀杏一片金黃。",
"國立古宮博物館前身是1992年開館的宮中遺物展示館，2005年改名並遷到現在這棟大樓（原本是國立中央博物館的建築）。館內收藏約4萬多件王室遺物，包括國王的御座、御寶（國璽）、王室服飾、儀仗與科學儀器。還有大韓帝國時期高宗、純宗坐過的御車，是韓國最早的汽車之一。",
"給爸媽看「日月五峰圖」屏風：國王坐在哪裡，背後就擺這幅畫，象徵太陽、月亮與五座山守護君王。館內還有朝鮮時代的自擊漏（自動報時的水鐘），是世宗大王時期的發明，比很多西方鐘錶還早。",
"門前銀杏樹拍全家福🍂；如果時間夠，地下一樓的科學文化室和王的御車很值得看（免費入場）。"],
["景福宮的第二道正門，穿過它就正式進入宮殿中心。",
"興禮門位於光化門與勤政門之間，最早建於1395年，原名弘禮門，後來為了避清朝乾隆皇帝（弘曆）的名諱改為興禮門。1916年日本為了蓋朝鮮總督府大樓，把興禮門和周圍的迴廊拆掉。1995年總督府大樓被拆除後，興禮門在2001年按原樣復原。門前流過的小溪叫禁川，上面的石橋是永濟橋。",
"跟爸媽說：連宮門名字都要「避皇帝的名字」，跟中國古代避諱一樣！再看永濟橋兩邊石欄上的石獸（天祿），據說是在守護宮殿、驅除邪氣，表情有點可愛，可以比誰先找到吐舌頭的那隻。",
"永濟橋上的石獸、從門洞望進去勤政門的層層屋頂（超好拍的構圖）。"],
["景福宮的正殿，國王舉行登基大典、接見使臣、百官朝會的地方，韓國國寶第223號。",
"現在的勤政殿是1867年大院君重建的，是韓國現存最大的木造建築之一。「勤政」出自鄭道傳的說法：天下之事，勤則治、不勤則廢。殿前廣場叫朝廷，兩側各有一排「品階石」，從正一品到正九品，文官站東邊、武官站西邊，按官位排隊。殿建在兩層石台（月臺）上，欄杆有十二生肖與四神的石雕。",
"考考爸媽：為什麼地上石板凹凸不平？這種石頭叫「薄石」，故意不磨平——可以防止陽光反射刺眼、下雨時防滑排水，還讓官員走路得慢慢走、顯得莊重。進殿看天花板，有兩條金色「七爪龍」：中國皇帝用五爪龍，朝鮮用七爪龍是高宗時期的特殊設計，至今仍有討論。國王寶座後面就是「日月五峰圖」。",
"品階石（找「正一品」站一下拍照）、天花板的七爪龍、寶座與日月五峰圖、月臺欄杆的生肖石雕（找爸媽的生肖！）。"],
["建在人工池上的大型宴會樓閣，國寶第224號，景福宮最美倒影就在這裡。",
"慶會樓最早建於1412年太宗時期，用來招待外國使臣、舉辦國家宴會。現在的建築是1867年重建的，二樓可以容納上百人。整座樓由48根石柱撐起，外圍是方柱、內側是圓柱，象徵「天圓地方」。池裡有兩座小島，挖池的土堆成了後面的峨嵋山。",
"跟爸媽說：慶會樓以前印在韓國舊版一萬元紙鈔背面（1979–2007年版本），是國家門面！據說重建時從池裡挖出兩條青銅龍，是用來鎮火災的——因為木造宮殿最怕火。",
"從池子東南角拍樓閣倒影＋楓葉🍁，秋天最美；數數看一樓的48根石柱。"],
["國王的寢殿（康寧殿）與王后的寢殿（交泰殿），是王室生活起居的地方。",
"康寧殿名字取自《書經》五福中的「康寧」，是國王睡覺和處理日常公務的地方；後方的交泰殿是王后的正寢，「交泰」取自《易經》泰卦，象徵天地陰陽調和。現在的建築是1990年代依史料重建的，因為原建築在1917年昌德宮大火後被日本拆去昌德宮重建用了。交泰殿後方是用慶會樓挖池土堆成的花園「峨嵋山」。",
"最好玩的冷知識：這兩座殿的屋頂沒有中間那條「正脊（龍脊）」！傳說國王就是龍，龍睡覺的地方屋頂不能再壓一條龍。帶爸媽仔細看屋頂中間——真的是平滑圓弧。峨嵋山後面有四座紅磚煙囪，刻著十長生、鳳凰、蝙蝠等吉祥圖案，其實是地暖（溫突）的排煙口，是寶物第811號。",
"抬頭看沒有龍脊的屋頂、交泰殿後面峨嵋山的花磚煙囪。"],
["池中央的六角小亭配上紅色木橋，景福宮秋色最美的地方🍁🍁。",
"香遠亭是高宗在1873年左右建乾清宮時一起蓋的。「香遠」取自北宋周敦頤《愛蓮說》的「香遠益清」——蓮花香氣飄得越遠越清新，池裡夏天真的會種荷花。連接小島的木橋叫醉香橋。北邊的乾清宮是高宗和明成皇后住的地方。",
"兩個故事：1887年，韓國第一盞電燈就在這附近的乾清宮點亮，發電用的就是香遠池的水，因為發電機很吵又常故障，當時人叫它「鬼火」。另一個比較沉重：1895年，明成皇后（閔妃）就在乾清宮被日本浪人刺殺，史稱乙未事變。可以講給爸媽聽，美麗的地方也有悲傷的歷史。",
"站在南邊岸邊拍香遠亭＋醉香橋＋楓葉倒影，旁邊北邊可以遠望乾清宮。"],
["介紹韓國傳統生活文化的國家博物館，前庭有紅楓與復古街景。",
"國立民俗博物館1945年開館，1993年搬進現在這棟建築（原本是國立中央博物館大樓，1975年完工）。建築外觀模仿了韓國有名的古建築：屋頂像法住寺捌相殿的五層木塔、石階像佛國寺的青雲橋白雲橋。館內三個常設展分別介紹韓國人的一年四季、一生禮俗與歷史生活。",
"前庭有一條「追憶的街道」，重現1970–80年代的首爾街景，有老理髮店、漫畫店、照相館，爸媽應該會覺得很懷舊，可以問他們台灣那時候是不是也長這樣！門口還有一排傳統石像（守護村莊的長丞），表情很搞笑。",
"前庭紅楓步道🍁、五層塔造型的建築、懷舊街景、長丞石像（免費入場）。"],
["景福宮的西門，從這裡出去就到西村，走幾分鐘就是土俗村。",
"景福宮有四座城門：南邊光化門、東邊建春門、北邊神武門、西邊迎秋門。按照五行，西方對應秋天，所以叫「迎秋」——迎接秋天；東門「建春」則對應春天。迎秋門以前是文武官員上朝出入的門。1926年因為電車路線被拆除，1975年重建，但一直沒開放，直到2018年才重新對一般民眾開放。",
"跟爸媽說：我們正好在秋天走迎秋門出宮，名字完全應景🍁！而且這道門關了將近半世紀，現在才能走，算是很幸運。",
"出門前回頭看一下城門上的匾額「迎秋門」。⚠ 若沒開放，請改從光化門出去，沿宮牆往西走。"],
["西村在地排隊名店的平價麵食，今天的午餐站🍜",
"體府洞一帶是朝鮮時代中人（翻譯官、醫官等技術官僚）聚居的地方，西村也因在景福宮西邊而得名。這家店以便宜大碗的잔치국수（宴會麵）出名，是附近上班族和在地人的愛店。",
"「잔치국수」字面意思是「宴會麵」——以前韓國辦婚禮會請客人吃這碗麵，象徵長長久久，所以韓國人問「什麼時候請吃麵？」就是在問「什麼時候結婚？」，可以拿來逗爸媽😆。",
"吃飽往東走：沿景福宮南側經光化門、東十字閣，再沿東牆往北上三清路看銀杏。"],
["沿著景福宮東牆延伸的三清路，秋天一整排銀杏金黃，是首爾最美的賞銀杏散步道之一🍁。",
"三清洞的名字來自道教的「三清」（玉清、上清、太清），朝鮮時代這裡有祭祀道教三清星辰的昭格署。另一個說法是這裡「山清、水清、人心清」所以叫三清。路的起點是東十字閣——原本是景福宮宮牆東南角的望樓，日本時期因拓寬馬路而和宮牆分開，現在孤零零站在路中間。",
"跟爸媽說：路中間那座孤立的小樓（東十字閣）以前是連在宮牆上的瞭望塔，被馬路硬生生切開了。三清路兩旁的銀杏都是公的或經過挑選，比較少有銀杏果的臭味——不過踩到黃色果實還是會很臭，走路小心！",
"東十字閣、宮牆＋銀杏的經典照、國立現代美術館前的庭院。"],
["1976年開業的三清洞甜湯老店，店名謙虛叫「首爾第二好吃的店」🍵。",
"這家店從1976年開到現在，招牌是熱呼呼的紅豆粥（단팥죽）。店名很謙虛，不說自己第一、只說「第二好吃」，結果反而成了三清洞最有名的老店之一。",
"跟爸媽說：店名翻譯就是「首爾第二好吃的店」，很謙虛吧！點紅豆粥（단팥죽）最適合，熱熱甜甜、無咖啡因。",
"紅豆粥（단팥죽）、糯米圓子；坐下來休息一下再往北村走。"],
["數百棟傳統韓屋聚集的住宅區，位在景福宮和昌德宮之間，能看到首爾最經典的屋瓦巷弄。",
"「北村」是指清溪川和鍾路的北邊，朝鮮時代住的是王族和高官兩班。現在看到的大部分韓屋其實是1920–30年代由建築商鄭世權等人把大宅分割、蓋成的中小型都市韓屋。2024年起部分區域實施觀光管制：北村路11街一帶每天 17:00 以後到隔天 10:00 禁止觀光客進入。",

"北村路11街的屋瓦斜坡（17:00 前要離開）、嘉會洞的韓屋巷弄；走平緩的路段就好，陡坡別硬爬。"],
["首爾最有名的傳統文化街，古董、筆墨紙硯、傳統工藝聚集的老街。",

"有趣冷知識：仁寺洞的名字是從朝鮮時代的「寬仁坊」和「大寺洞」各取一個字組成的。巷子裡藏著很多傳統茶院和老畫廊，有些已經開了半世紀以上。",
"主街仁寺洞街的老招牌、韓文招牌的連鎖店、往巷子裡看看傳統工藝的老店面（當作街景欣賞就好）。"],
["1920年代蓋的都市韓屋巷弄，現在是首爾最有氛圍的老巷之一。",

"生態林區養著梅花鹿（꽃사슴，sika deer），在圍起來的放養區裡自由活動，旁邊有步道與觀景點。",

[37.575925,126.976816,"🏯","光化門","경복궁 광화문","p",["景福宮的正門，也是首爾最具代表性的城門。","1395年建成，名字意思是「光照四方、德化天下」。壬辰倭亂燒毀，1867年重建；日本殖民時期被移到建春門北側，韓戰時木造門樓又被炸毀。1968年用鋼筋水泥重建但位置歪了，2010年才按原位、原材料重新復原。","門前兩隻石獸叫「獬豸（해태）」，傳說能分辨善惡、還能防火——首爾市的吉祥物就是牠！門洞天花板畫著朱雀等瑞獸。","10:00–15:00 每整點的守門將換崗儀式；看門洞上的畫和兩隻獬豸。"]],

[37.577738,126.976946,"🏯","勤政門","경복궁 근정문","p",["勤政殿正前方的門，穿過就是朝會的大廣場。","勤政門是寶物第812號，屬於1867年重建的原建築。門分三個門洞，中間只有國王能走，文官走東、武官走西。國王即位典禮有時就在勤政門舉行。","跟爸媽說：中間那條稍高的路叫「御道」，只有國王能走——我們現在可以隨便走，算是當一天國王！","三個門洞、腳下的三道（御道）。"]],
[37.57854,126.97699,"🏛️","勤政殿","경복궁 근정전","p",["景福宮正殿，國寶第223號。","國王登基、接見外國使臣、百官朝賀的地方，1867年重建，是韓國現存最大的木造殿堂之一。殿前有品階石標示官員位置，月臺欄杆刻著四神與十二生肖。","地上薄石故意不磨平：防反光、防滑、讓官員慢慢走顯得莊重。天花板有兩條七爪金龍，寶座後是日月五峰圖。","品階石、七爪龍、生肖石雕。"]],
[37.579067,126.977003,"🏛️","思政殿","경복궁 사정전","p",["國王日常辦公、和大臣討論政事的地方。","「思政」意思是國王要「深思而治理」，名字也是鄭道傳取的。這裡是國王每天早上聽取報告（常參）、讀經史的便殿，寶物第1759號。殿內也有日月五峰圖。","據說世宗大王常在這裡和學者討論到深夜。殿前左右兩側的萬春殿、千秋殿是附屬便殿，三棟一組。","從門口看殿內的寶座與日月五峰圖。"]],
[37.579068,126.97735,"🏛️","萬春殿","경복궁 만춘전","p",["思政殿東側的便殿，名字對應春天。","東方在五行中屬春，所以東側叫萬春殿、西側叫千秋殿。冬天國王會在這裡辦公，因為有地暖（溫突）。韓戰時燒毀，1988年復原。","和千秋殿名字合起來就是「千秋萬春」，意思是國運長長久久，很像我們說的「千秋萬世」。","跟千秋殿一起看，東西對稱。"]],
[37.57909,126.976655,"🏛️","千秋殿","경복궁 천추전","p",["思政殿西側的便殿，名字對應秋天。","西方屬秋，所以叫千秋殿；有溫突，國王冬天在這裡辦公和讀書。","據說世宗大王和集賢殿學者在這附近討論學問，韓文（訓民正音）的構想也和這群學者有關。","剛好秋天來看「千秋殿」🍁。"]],
[37.578971,126.97595,"🏛️","修政殿","경복궁 수정전","p",["慶會樓南邊的大殿，原本是世宗大王的集賢殿所在地。","集賢殿是世宗時期的學術研究機構，學者們在這裡協助創制韓文「訓民正音」（1443年）。現在的修政殿是1867年重建，寶物第1760號；1894年甲午改革時曾當作軍國機務處的辦公室。","跟爸媽說：韓國人現在用的韓文字母，就是在這附近被發明出來的！一萬韓元紙鈔上的人物就是世宗大王。","寬大的月臺；想像世宗和學者討論文字的場景。"]],
[37.57975,126.97597,"🏯","慶會樓","경복궁 경회루","p",["池上的國宴樓閣，國寶第224號。","1412年建，1867年重建。48根石柱撐起，外方內圓象徵天圓地方，用來招待外國使臣。","舊版一萬元紙鈔（1979–2007）背面印的就是慶會樓；重建時池裡挖出青銅龍，用來鎮火。","倒影＋楓葉🍁。"]],
[37.57953,126.97702,"🏛️","康寧殿","경복궁 강녕전","p",["國王的寢殿。","名取《書經》五福之一「康寧」。原建築1917年被移去重建昌德宮，1995年復原。","屋頂沒有正脊（龍脊）——國王是龍，龍睡的地方不能再壓一條龍。","看沒有龍脊的屋頂。"]],
[37.579906,126.977057,"🏛️","交泰殿","경복궁 교태전","p",["王后的寢殿。","「交泰」取自《易經》泰卦，天地交而萬物通，象徵國王王后和諧。也被拆去昌德宮，1995年復原。","屋頂一樣沒有龍脊；後面就是王后專屬的花園峨嵋山。","後門出去看峨嵋山煙囪。"]],
[37.5802,126.97712,"🌳","峨嵋山（花園）≈","경복궁 아미산","p",["交泰殿後方的王后花園。","用挖慶會樓池子的土堆成的小山丘，名字借自中國四川的峨嵋山。種了花木、擺了石盆。","四座紅磚六角煙囪是寶物第811號，刻著鶴、蝙蝠、鳳凰、竹、梅等吉祥圖案，其實是寢殿溫突地暖的排煙口——連煙囪都要漂亮！","磚造煙囪上的圖案。"]],
[37.580322,126.978024,"🏛️","慈慶殿","경복궁 자경전","p",["大院君為養母神貞王后（趙大妃）建的寢殿，寶物第809號。","1867年建，後因火災1888年重建，是景福宮少數保留原貌的寢殿。「慈慶」是祝福長輩慈愛喜慶。","北牆的「十長生煙囪」是寶物第810號，刻著太陽、山、水、石、雲、松、不老草、龜、鶴、鹿十種長壽象徵——很適合跟爸媽說「祝你們長命百歲」！西邊花牆也有花紋。北牆邊秋天銀杏很美。","十長生煙囪（在北面外牆）。"]],
[37.57902,126.977936,"🏛️","東宮（資善堂・丞華堂）","경복궁 자선당","p",["王世子（太子）和世子嬪生活、讀書的地方。","東方代表日出與成長，所以太子住東邊，稱東宮。資善堂是寢殿、丕顯閣是辦公處。日本殖民時期資善堂被拆到日本，後來在大地震燒毀，1999年復原，原基石在1995年送回韓國，放在乾清宮附近。","據說資善堂的基石被日本人帶回東京當私人庭院的裝飾，過了快80年才回來。","資善堂、丕顯閣兩棟。"]],
[37.579011,126.978401,"🏛️","丕顯閣","경복궁 비현각","p",["王世子辦公、學習的地方。","「丕顯」意思是大大地彰顯德行。和資善堂一起構成東宮，1999年復原。","太子每天要上很多堂課（書筵），老師都是當代大學者——當太子壓力很大！","與資善堂一起看。"]],
[37.57965,126.97815,"🍚","燒廚房（重建區）≈","경복궁 소주방","p",["王室的御膳廚房。","分內燒廚房（做國王日常三餐）、外燒廚房（做宴會菜）、生物房（做點心）。日本殖民時期被拆，2015年復原。","韓劇《大長今》裡的御膳廚房就是這種地方！有時會有宮廷點心體驗活動。","想像大長今在這裡做菜。"]],
[37.5829,126.97715,"🏯","乾清宮≈","경복궁 건청궁","p",["高宗與明成皇后居住的宮中之宮。","1873年高宗用自己的私房錢蓋的，風格像士大夫家的韓屋、沒有塗丹青。1887年韓國第一盞電燈在這裡點亮。1895年明成皇后在此遇刺（乙未事變）。1909年被拆，2007年復原。","據說第一批電燈常故障又很耗水，民間叫它「鬼火」。","樸素的韓屋建築，對比宮殿的華麗。"]],
[37.58238,126.97705,"🏯","香遠亭","경복궁 향원정","p",["池中六角亭，秋色第一。","1873年左右建，名取《愛蓮說》「香遠益清」，橋叫醉香橋。2021年整修後橋移回原本在北側的位置。","附近乾清宮點亮韓國第一盞電燈，用的是池水發電。","南岸拍倒影🍁。"]],
[37.583434,126.976085,"🏛️","集玉齋","경복궁 집옥재","p",["高宗的書齋與圖書館。","1891年從昌德宮移建來，「集玉」是收集珍寶（書）的意思。建築帶有中式風格，用磚牆、匾額是中國書法家米芾的字。","據說高宗在這裡接見外國公使；現在是小型圖書館，可以進去坐一下看書。","中式風格的磚牆和屋頂。"]],
[37.58259,126.97415,"🏛️","泰元殿","경복궁 태원전","p",["供奉太祖御真（畫像）與王室喪禮時停靈的地方。","1868年建，日本時期被拆，2006年復原。明成皇后遇害後，靈柩曾停放在附近。","這一區很安靜、人少，是逃離人潮的好地方。","寧靜的院落。"]],
[37.583537,126.97552,"🏯","神武門","경복궁 신무문","p",["景福宮北門。","北方對應玄武，所以叫神武門，門洞天花板畫著玄武（龜蛇）。平常很少打開，出去就是青瓦台。","據說北門平時緊閉，因為北方屬陰；現在門外的青瓦台以前是總統府。","門洞天花板的玄武。"]],
[37.578136,126.979339,"🏯","建春門","경복궁 건춘문","p",["景福宮東門。","東方屬春、對應青龍，門洞畫著青龍。主要是王族與宗親出入。","四座門對應四季：光化（南/夏）、建春（東/春）、迎秋（西/秋）、神武（北/冬）——可以考爸媽！","門洞青龍。"]],
[37.57876,126.97407,"🏯","迎秋門","경복궁 영추문","p",["景福宮西門。","西方屬秋，門洞畫白虎。1926年為電車拆除，1975年重建，2018年才開放。","秋天走迎秋門，超應景🍁。","匾額「迎秋門」。"]],
[37.576511,126.97752,"🏯","協生門","경복궁 협생문","p",["興禮門東側的小門。","與西側的用成門對稱，是宮中人員出入的側門，2010年代復原。","據說「協生」是希望大家和睦共生。","與用成門對稱。"]],
[37.57657,126.97497,"🏛️","國立古宮博物館","국립고궁박물관","p",["王室文物博物館。","2005年遷到現址，收藏4萬多件王室遺物：御座、御寶、王的御車。","有世宗時期的自擊漏（自動報時水鐘）。","免費入場。"]],
[37.58083,126.97904,"🏛️","國立民俗博物館","국립민속박물관","p",["韓國生活文化博物館。","1993年遷入現館，外觀模仿法住寺捌相殿與佛國寺石階。","前庭有1970–80年代懷舊街道。","紅楓🍁、懷舊街。"]],
// 西村
[37.580755,126.969996,"🏮","通仁市場（葉錢便當）","통인시장","s",["1941年就有的西村傳統市場，可以用「葉錢」買小菜。","日本殖民時期為住在附近的日本人開設的公設市場，後來變成在地居民的菜市場，約70多家店。2012年起推出「葉錢便當」：用古銅錢樣式的代幣，在各攤位挑菜放進便當盒。","必吃（全熟）：기름떡볶이（油炒年糕，有不辣的醬油口味），很適合長輩。市場是在地人日常生活的地方，跟爸媽逛逛很有韓國菜市場的感覺。","葉錢便當服務台（約11:00–16:00，週一及每月第三個週日休，以 Naver 為準）。"]],
[37.579717,126.969322,"📚","大誠書店（大五書店）","대오서점","s",["1951年開業、首爾最老的二手書店之一。","老闆夫婦用兩人名字各取一字命名，後來成為西村懷舊地標，現在主要是參觀用的小空間。","韓國綜藝和電影常來這裡取景，木門、老招牌超有味道。","門口拍照（進去參觀可能要收費，以現場為準）。"]],
[37.5785,126.9706,"🖋️","李箱之家≈","이상의 집","s",["韓國現代主義詩人李箱（이상）故居址。","李箱（1910–1937）是韓國最前衛的詩人、小說家，代表作《翅膀》，3歲到23歲住在這裡。原屋已不在，現在是一個小型紀念空間，免費參觀。","他本名金海卿，據說在建築工地工作時被日本人叫錯名字「李さん」，就乾脆取筆名「李箱」。","黑色鐵門的小空間（位置約略）。"]],
[37.581312,126.966766,"🎨","朴魯壽美術館","박노수미술관","s",["韓國畫家朴魯壽的故居美術館，房子本身是1938年的老洋房。","朴魯壽（1927–2013）是韓國代表性的東洋畫家。這棟房子融合韓、日、西式風格，原本是日本殖民時期親日派尹德榮為女兒蓋的，1973年朴魯壽買下住了40年，後捐給鍾路區。","後院小山坡可以俯瞰西村，秋天很漂亮。","老洋房、後院（週一休，需門票）。"]],
[37.582085,126.964248,"🏞️","水聲洞溪谷","수성동계곡","s",["仁王山腳的溪谷，朝鮮畫家鄭敾畫過的地方。","因水聲很大而得名。朝鮮後期畫家謙齋鄭敾的《章義洞八景帖》裡畫過這裡，2012年拆除老公寓後復原。","可以跟爸媽比對鄭敾的畫和眼前的石橋「麒麟橋」——幾百年前的同一座橋！","麒麟橋石橋、秋天楓葉（從土俗村走約15分，有點上坡）。"]],
[37.5786,126.9722,"🌲","通義洞白松遺址≈","통의동 백송터","s",["曾是韓國最大、樹齡約600年的白松（天然紀念物）。","白松樹皮是白色的，是從中國傳來的珍貴樹種。1990年颱風吹倒後枯死，現在只剩樹樁和後來種的小白松。","據說這一帶是英祖即位前住的彰義宮舊址。","樹樁與小白松（位置約略）。"]],
[37.589384,126.965279,"📖","尹東柱文學館（較遠）","윤동주문학관","s",["紀念詩人尹東柱的文學館，由舊水塔改造。","尹東柱（1917–1945）延禧專門學校時期住在西村附近，常上仁王山寫詩。1945年在日本福岡監獄去世，年僅27歲。代表作《序詩》。","展館的「封閉的井」空間模擬他過世的監獄，很有感觸。從土俗村搭公車約10分。","第三展廳、山上的詩人之丘（週一休）。"]],
// 備案餐廳
[37.576553,126.97149,"🍲","체부동잔치집（體府洞宴會之家）","체부동잔치집","r",["西村排隊名店的平價麵食店，離土俗村很近。","推薦點：잔치국수（宴會清湯麵，鯷魚湯底）、비빔국수（拌麵，會辣）、파전（海鮮蔥煎餅，全熟）、만두（餃子）。價格約每份 ₩5,000–13,000（約台幣 122–318 元）。","清湯麵很清淡、適合長輩；店內熱鬧，翻桌快。","營業時間約 11:00–22:00（以 Naver 為準）。"]],
[37.57886,126.973686,"🍲","메밀꽃필무렵（蕎麥花開時）","메밀꽃필무렵","r",["迎秋門旁的蕎麥料理店，在地人愛店。","推薦點：온메밀국수（熱湯蕎麥麵）、메밀전병（蕎麥煎餅捲，全熟）、감자전（馬鈴薯煎餅）、수육（水煮豬肉）。每人約 ₩10,000–20,000（約台幣 244–489 元）。","熱湯蕎麥麵清爽好消化，長輩友善。","營業時間請以 Naver 為準（多數日子午餐時段營業）。"]],
[37.580127,126.969042,"🍲","영화루（永和樓）","영화루","r",["西村老牌中華料理，在地營業數十年。","推薦點：간짜장（乾炸醬麵）、짬뽕（炒碼麵，會辣）、탕수육（糖醋肉，全熟）。招牌「고추간짜장」很辣，給爸媽點一般的간짜장。每份約 ₩8,000–20,000（約台幣 196–489 元）。","據說是韓國電視美食節目介紹過的老店。","營業時間請以 Naver 為準，可能有午休。"]],
