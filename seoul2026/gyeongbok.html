<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🐻 景福宮賞楓散步地圖</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{--copper:#c56f45;--copper-soft:#f3dfd1;--ink:#10272c;--line:#d9ddd5;--muted:#6c7d7d;--paper:#f6f3ec;--sage:#789681;--sage-soft:#dfe9df;--sand-soft:#efe6d3;--white:#fffef9;--critical:#a84f40;--sans:"Geist","PingFang TC","Noto Sans TC",system-ui,sans-serif;--serif:"Noto Serif TC",serif;--mono:"Geist Mono",ui-monospace,monospace;--shadow:0 24px 60px rgba(21,43,45,.09)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans)}
#map{position:fixed;inset:0 0 42vh 0}
header{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;z-index:500;background:var(--white);border:1px solid var(--line);border-radius:18px;padding:8px 12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px}
header h1{font-family:var(--serif);font-size:16px;margin:0;flex:1}header a{color:var(--copper);font-size:13px;text-decoration:none}
#next{position:fixed;top:calc(62px + env(safe-area-inset-top));left:8px;right:8px;z-index:500;background:var(--copper-soft);border-radius:14px;padding:6px 12px;font-size:14px;box-shadow:var(--shadow)}
#msg{display:none;position:fixed;top:calc(104px + env(safe-area-inset-top));left:8px;right:8px;z-index:500;background:#f2dcd6;color:var(--critical);border-radius:14px;padding:8px 12px;font-size:13px}
.fab{position:fixed;right:12px;bottom:calc(42vh + 12px);z-index:500;display:flex;flex-direction:column;gap:8px}
.fab button{border:0;border-radius:50%;width:48px;height:48px;font-size:22px;background:var(--white);box-shadow:var(--shadow)}
#panel{position:fixed;left:0;right:0;bottom:0;height:42vh;overflow:auto;background:var(--paper);border-top:1px solid var(--line);padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.card.done{background:var(--sage-soft)}.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--copper);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-weight:700}
.card.done .num{background:var(--sage)}.card b{font-size:15px}.ko{color:var(--muted);font-size:13px}.d{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.copy{border:1px solid var(--line);background:var(--sand-soft);border-radius:10px;padding:5px 9px;font-size:13px;color:var(--ink)}
.hotel{background:var(--sand-soft);border-radius:16px;padding:10px 12px;font-size:13px;margin-top:6px}
.pin{width:30px;height:30px;border-radius:50%;background:var(--copper);color:#fff;border:3px solid #fff;display:grid;place-items:center;font:700 14px var(--mono);box-shadow:0 3px 8px rgba(0,0,0,.3)}
.pin.done{background:var(--sage)}.leaf{font-size:22px;animation:sway 2s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(15deg)}}
.bear{font-size:34px;line-height:1;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}.bear span{display:inline-block;animation:bounce .7s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-8px)}}
.leaflet-popup-content{font-family:var(--sans);font-size:14px}.leaflet-popup-content h3{font-family:var(--serif);margin:0 0 4px}
.pop a{color:var(--copper)}
</style></head><body>
<header><h1>🐻 景福宮賞楓散步 🍁</h1><a href="./">← 回行程</a></header>
<div id="next">📍 正在找你的位置…</div><div id="msg"></div>
<div id="map"></div>
<div class="fab"><button id="me" title="回到我">🎯</button><button id="fit" title="看全部">🗺️</button><button id="clr" title="清除足跡">🧹</button></div>
<div id="panel"><div id="list"></div>
<div class="hotel">🏨 飯店：Ibis Styles Ambassador Seoul Gangnam<br><span class="ko">서울 강남구 삼성로 431</span> <button class="copy" data-c="서울 강남구 삼성로 431">複製地址</button></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const S=[
[37.57636,126.97368,"景福宮站5號出口","경복궁역 5번출구","從地鐵3號線上來，出口就在古宮博物館旁邊，出站往右前方走。"],
[37.57660,126.97510,"國立古宮博物館銀杏","국립고궁박물관","博物館前一排金黃銀杏🍂，先拍一張全家福！",1],
[37.57710,126.97690,"興禮門","경복궁 흥례문","景福宮第二道門，進去前要先買票（10/29起免費開放）。"],
[37.57870,126.97695,"勤政殿","경복궁 근정전","國王上朝的正殿。前庭的「品階石」標出官員站的位置；地面石板故意鋪得凹凸不平，防止反光又能讓官員走路放慢、保持端莊。"],
[37.57965,126.97590,"慶會樓","경복궁 경회루","池中央的宴會樓閣，倒影＋楓葉超美🍁，必拍！",1],
[37.58000,126.97700,"康寧殿・交泰殿","경복궁 강녕전","國王與王后的寢殿。屋頂沒有正脊（龍脊）——傳說國王就是龍，屋頂上不能再壓一條龍。"],
[37.58260,126.97710,"香遠亭","경복궁 향원정","池中小亭＋拱橋，全宮秋色最美的地方🍁🍁",1],
[37.58150,126.97900,"國立民俗博物館前楓葉","국립민속박물관","博物館前庭院紅楓步道🍁，拍完回香遠亭往西走。",1],
[37.57790,126.97420,"迎秋門（西側出口）","경복궁 영추문","從西門出去最近土俗村。⚠ 如果迎秋門沒開，改從光化門那側出去，再沿宮牆往西走。"],
[37.57790,126.97140,"土俗村蔘雞湯","토속촌삼계탕","📍서울 종로구 자하문로5길 5<br>每天 10:00–22:00 不休息。<br>從景福宮站2號出口走約200m，GS25 左邊的小巷進去。"]];
const R=[[37.57636,126.97368],[37.57650,126.97440],[37.57660,126.97510],[37.57670,126.97600],[37.57690,126.97690],[37.57710,126.97690],[37.57790,126.97690],[37.57870,126.97695],[37.57920,126.97690],[37.57930,126.97640],[37.57965,126.97640],[37.57965,126.97590],[37.57965,126.97640],[37.57990,126.97660],[37.58000,126.97700],[37.58060,126.97700],[37.58150,126.97700],[37.58220,126.97710],[37.58260,126.97710],[37.58230,126.97790],[37.58180,126.97860],[37.58150,126.97900],[37.58180,126.97860],[37.58230,126.97790],[37.58260,126.97710],[37.58220,126.97640],[37.58100,126.97560],[37.57930,126.97490],[37.57800,126.97470],[37.57790,126.97420],[37.57790,126.97300],[37.57785,126.97200],[37.57790,126.97140]];
const map=L.map('map',{zoomControl:false}).setView([37.5795,126.9765],16);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
L.polyline(R,{color:'#c56f45',weight:5,opacity:.8,dashArray:'8 8'}).addTo(map);
let done=JSON.parse(localStorage.gbDone||'[]');const mk=[];let me=null;
function nIcon(i){return L.divIcon({className:'',html:`<div class="pin ${done.includes(i)?'done':''}">${done.includes(i)?'✓':i}</div>`,iconSize:[30,30],iconAnchor:[15,15]})}
S.forEach((s,i)=>{const nv='https://map.naver.com/p/search/'+encodeURIComponent(s[3]);
mk[i]=L.marker([s[0],s[1]],{icon:nIcon(i)}).addTo(map).bindPopup(`<div class="pop"><h3>${i}. ${s[2]}</h3><div class="ko">${s[3]}</div><p>${s[4]}</p><button class="copy" data-c="${s[3]}">📋 複製韓文</button> <a href="${nv}" target="_blank">Naver 地圖 ↗</a></div>`);
if(s[5])L.marker([s[0]+.00025,s[1]+.0003],{icon:L.divIcon({className:'',html:'<div class="leaf">🍁</div>',iconSize:[24,24]}),interactive:false}).addTo(map);});
function dist(a,b,c,d){const r=6371e3,p=Math.PI/180,x=Math.sin((c-a)*p/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin((d-b)*p/2)**2;return 2*r*Math.asin(Math.sqrt(x))}
function fm(m){return m<1000?Math.round(m)+' m':(m/1000).toFixed(1)+' km'}
function render(){document.getElementById('list').innerHTML=S.map((s,i)=>`<div class="card ${done.includes(i)?'done':''}" data-i="${i}"><div class="num">${done.includes(i)?'✓':i}</div><div><b>${s[2]}${s[5]?' 🍁':''}</b><div class="ko">${s[3]}</div></div><div class="d">${me?fm(dist(me[0],me[1],s[0],s[1])):''}</div><button class="copy" data-c="${s[3]}">📋</button></div>`).join('');
const n=S.findIndex((s,i)=>!done.includes(i));document.getElementById('next').innerHTML=n<0?'🎉 全部走完！好好吃蔘雞湯吧～':`➡️ 下一站 <b>${n}. ${S[n][2]}</b>${me?'・還有 '+fm(dist(me[0],me[1],S[n][0],S[n][1])):''}`;}
document.addEventListener('click',e=>{const c=e.target.closest('.copy');if(c){e.stopPropagation();const t=c.dataset.c;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()});const o=c.textContent;c.textContent='✅ 已複製';setTimeout(()=>c.textContent=o,1200);return}
const k=e.target.closest('.card');if(k){const i=+k.dataset.i;map.flyTo([S[i][0],S[i][1]],18);mk[i].openPopup()}});
let trail=JSON.parse(localStorage.gbTrail||'[]');const tl=L.polyline(trail,{color:'#789681',weight:6,opacity:.9}).addTo(map);
const bear=L.marker([0,0],{icon:L.divIcon({className:'',html:'<div class="bear"><span id="b">🐻</span></div>',iconSize:[36,36],iconAnchor:[18,30]}),zIndexOffset:1000});let first=true,lastLng=null;
function onPos(p){const la=p.coords.latitude,ln=p.coords.longitude;me=[la,ln];document.getElementById('msg').style.display='none';
if(!map.hasLayer(bear))bear.addTo(map);bear.setLatLng(me);
const b=document.getElementById('b');if(b){if(lastLng!==null&&Math.abs(ln-lastLng)>1e-6)b.parentElement.style.transform=ln<lastLng?'scaleX(-1)':'';}lastLng=ln;
const l=trail[trail.length-1];if(!l||dist(l[0],l[1],la,ln)>4){trail.push([la,ln]);if(trail.length>3000)trail.shift();localStorage.gbTrail=JSON.stringify(trail);tl.setLatLngs(trail)}
S.forEach((s,i)=>{if(!done.includes(i)&&dist(la,ln,s[0],s[1])<40){done.push(i);localStorage.gbDone=JSON.stringify(done);mk[i].setIcon(nIcon(i));if(navigator.vibrate)navigator.vibrate(200)}});
if(first){first=false;map.setView(me,17)}render()}
function onErr(e){const m=document.getElementById('msg');m.style.display='block';m.innerHTML=e.code===1?'🙈 沒有定位權限。請到 iPhone「設定 › 隱私權 › 定位服務 › Safari」改成「使用 App 期間」，再重新整理。地圖和路線仍可使用。':'📡 暫時抓不到 GPS，請到空曠處稍等一下…'}
if('geolocation' in navigator)navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:2000,timeout:20000});else onErr({code:2});
document.getElementById('me').onclick=()=>me?map.flyTo(me,18):onErr({code:2});
document.getElementById('fit').onclick=()=>map.fitBounds(L.latLngBounds(R),{padding:[30,30]});
document.getElementById('clr').onclick=()=>{if(confirm('清除足跡和打勾紀錄？')){trail=[];done=[];localStorage.gbTrail='[]';localStorage.gbDone='[]';tl.setLatLngs([]);S.forEach((s,i)=>mk[i].setIcon(nIcon(i)));render()}};
map.fitBounds(L.latLngBounds(R),{padding:[30,30]});render();
</script></body></html>
